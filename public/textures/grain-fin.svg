<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" seed="23" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.6" intercept="-0.28" />
      <feFuncG type="linear" slope="1.6" intercept="-0.28" />
      <feFuncB type="linear" slope="1.6" intercept="-0.28" />
      <feFuncA type="table" tableValues="0 0.82" />
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" fill="#2d2a29" filter="url(#grain)" />
</svg>
